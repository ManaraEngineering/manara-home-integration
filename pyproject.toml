[project]
name = "manara-home-integration"
version = "0.0.1"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
# Lenient for now; tighten as real code lands.
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
